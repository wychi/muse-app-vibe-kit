# Assembles the Pages site from the modules and deploys it.
# Each module's demo is built from its own directory at deploy time:
#   modules/<name>/demo/* + reference/ bundle -> _site/<demo.path>/
# _site/index.html (the collection landing page) is generated too.
# Nothing is checked in under site/ anymore — modules are the source of truth.
# In repo Settings → Pages, set Source to "GitHub Actions".
name: Build and deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site from modules
        run: node .github/workflows/build-site.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
