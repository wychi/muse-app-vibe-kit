name: E2E demo tests

on:
  workflow_run:
    workflows: ["Build and deploy site to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        # Local install (not -g): run-demo-e2e.mjs imports "playwright" as a
        # package, which Node ESM cannot resolve from the global npm root.
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install chromium --with-deps

      - name: Run demo E2E tests
        run: node .github/workflows/run-demo-e2e.mjs
        env:
          DEMO_BASE_URL: https://wychi.github.io/muse-app-vibe-kit

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-e2e-screenshots
          path: e2e-shots/
          retention-days: 30

      - name: Sync hero screenshots to repo
        if: success()
        run: |
          for mod in modules/*/; do
            name=$(basename "$mod")
            hero="e2e-shots/$name/03-dragged.png"
            [ -f "$hero" ] || hero="e2e-shots/$name/03-strokes.png"
            [ -f "$hero" ] || hero="e2e-shots/$name/02-captured.png"
            if [ -f "$hero" ]; then
              mkdir -p "$mod/demo/screenshots"
              cp "$hero" "$mod/demo/screenshots/hero.png"
              echo "synced $name hero"
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/*/demo/screenshots/hero.png
          git diff --cached --quiet || git commit -m "[skip ci] sync demo hero screenshots from E2E"
          git push
